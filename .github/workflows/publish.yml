name: Publish Tool packages

on:
  workflow_dispatch:
    inputs:
      offset:
        description: Zero-based package offset in the sorted release catalog
        required: true
        default: "0"
        type: string
      limit:
        description: Packages in this batch (maximum 10; 8 recommended)
        required: true
        default: "8"
        type: string
      tag:
        description: npm dist-tag
        required: true
        default: latest
        type: string
      dry_run:
        description: Verify archives and registry state without publishing
        required: true
        default: false
        type: boolean

permissions:
  contents: read
  id-token: write

concurrency:
  group: npm-tool-publish
  cancel-in-progress: false

jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 9.15.4

      - name: Install Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 20.19.0
          registry-url: https://registry.npmjs.org
          scope: '@firedrill-tools'

      - name: Verify reproducible release catalog
        run: pnpm package:catalog --output-dir "$RUNNER_TEMP/firedrill-tools"

      - name: Require a bootstrap publishing token
        if: inputs.dry_run == false
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          set -euo pipefail
          [[ -n "$NODE_AUTH_TOKEN" ]] || { echo "NPM_TOKEN is not configured" >&2; exit 1; }

      - name: Publish one rate-safe, idempotent batch
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: >-
          pnpm release:publish --catalog-dir "$RUNNER_TEMP/firedrill-tools"
          --offset "${{ inputs.offset }}"
          --limit "${{ inputs.limit }}"
          --tag "${{ inputs.tag }}"
          --summary "$RUNNER_TEMP/npm-publish-summary.json"
          ${{ inputs.dry_run && '--dry-run' || '' }}

      - name: Upload immutable publish receipt
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: npm-publish-${{ github.sha }}-${{ inputs.offset }}
          path: ${{ runner.temp }}/npm-publish-summary.json
          if-no-files-found: warn
          retention-days: 90
