name: Remove legacy Tool package names

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: Type DELETE_31_LEGACY_FIREDRILL_TOOL_PACKAGES
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: npm-tool-publish
  cancel-in-progress: false

jobs:
  remove:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      NPM_TOKEN_PUBLISHER_A: ${{ secrets.NPM_TOKEN_PUBLISHER_A }}
      NPM_TOKEN_PUBLISHER_B: ${{ secrets.NPM_TOKEN_PUBLISHER_B }}
      NPM_TOKEN_PUBLISHER_C: ${{ secrets.NPM_TOKEN_PUBLISHER_C }}
    steps:
      - name: Verify explicit confirmation and publisher identities
        env:
          CONFIRMATION: ${{ inputs.confirmation }}
        run: |
          set -euo pipefail
          [[ "$CONFIRMATION" == "DELETE_31_LEGACY_FIREDRILL_TOOL_PACKAGES" ]] || {
            echo "Refusing to delete packages: confirmation does not match." >&2
            exit 1
          }
          [[ -n "$NPM_TOKEN_PUBLISHER_A" && -n "$NPM_TOKEN_PUBLISHER_B" && -n "$NPM_TOKEN_PUBLISHER_C" ]] || {
            echo "All three publisher tokens are required." >&2
            exit 1
          }

          verify_identity() {
            local token="$1"
            local expected="$2"
            local npmrc="$RUNNER_TEMP/npmrc-$expected"
            printf '//registry.npmjs.org/:_authToken=%s\n' "$token" > "$npmrc"
            chmod 600 "$npmrc"
            local actual
            actual="$(npm whoami --registry https://registry.npmjs.org --userconfig "$npmrc")"
            [[ "$actual" == "$expected" ]] || {
              echo "Expected npm account $expected, received $actual." >&2
              exit 1
            }
          }

          verify_identity "$NPM_TOKEN_PUBLISHER_A" kirandas
          verify_identity "$NPM_TOKEN_PUBLISHER_B" kiran.epic
          verify_identity "$NPM_TOKEN_PUBLISHER_C" kiran-reloadwork

      - name: Preflight every clean replacement
        run: |
          set -euo pipefail
          tools=(
            attio box check datadog discord documenso dropbox github gitlab gmail
            google-calendar google-docs google-drive google-sheets google-workspace
            hubspot jira linear linkedin netsuite notion quickbooks resend salesforce
            slack stripe trolley unified unstructured waterfall xero
          )
          [[ "${#tools[@]}" -eq 31 ]]
          for tool in "${tools[@]}"; do
            npm view "@firedrill-tools/$tool" version --registry https://registry.npmjs.org >/dev/null
            npm view "@firedrill-tools/tool-$tool" version --registry https://registry.npmjs.org >/dev/null
          done

      - name: Delete exact legacy allowlist
        run: |
          set -euo pipefail
          groups=(
            "A:attio box check datadog discord documenso dropbox github gitlab gmail google-calendar"
            "B:google-docs google-drive google-sheets google-workspace hubspot jira linear linkedin netsuite notion"
            "C:quickbooks resend salesforce slack stripe trolley unified unstructured waterfall xero"
          )

          for group in "${groups[@]}"; do
            slot="${group%%:*}"
            names="${group#*:}"
            token_variable="NPM_TOKEN_PUBLISHER_${slot}"
            token="${!token_variable}"
            npmrc="$RUNNER_TEMP/npmrc-delete-$slot"
            printf '//registry.npmjs.org/:_authToken=%s\n' "$token" > "$npmrc"
            chmod 600 "$npmrc"
            for tool in $names; do
              npm unpublish "@firedrill-tools/tool-$tool" --force \
                --registry https://registry.npmjs.org \
                --userconfig "$npmrc"
            done
          done

      - name: Prove clean names remain and legacy names are absent
        run: |
          set -euo pipefail
          tools=(
            attio box check datadog discord documenso dropbox github gitlab gmail
            google-calendar google-docs google-drive google-sheets google-workspace
            hubspot jira linear linkedin netsuite notion quickbooks resend salesforce
            slack stripe trolley unified unstructured waterfall xero
          )
          for tool in "${tools[@]}"; do
            npm view "@firedrill-tools/$tool" version --registry https://registry.npmjs.org >/dev/null
            if npm view "@firedrill-tools/tool-$tool" version --registry https://registry.npmjs.org >/dev/null 2>&1; then
              echo "Legacy package still exists: @firedrill-tools/tool-$tool" >&2
              exit 1
            fi
          done
          echo "All 31 clean packages remain and all 31 legacy package names are absent."
